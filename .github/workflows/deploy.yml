name: 🚀 Deploy to HostGator (FTP)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Evita deploys concorrentes sobrescrevendo o servidor
concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ─── PHP / Composer (dependências de produção) ───────────────
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip, intl
          tools: composer:v2
          coverage: none

      - name: 📦 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── Assets front-end (Vite) ──────────────────────────────────────────
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🎨 Build frontend assets
        run: npm run build

      # ── Preparação dos arquivos para envio ───────────────────────────────
      - name: 🧹 Remover artefatos que não devem ir ao servidor
        run: |
          rm -rf node_modules
          rm -rf .git .github tests
          rm -f .env .env.example .env.testing .env.prod .env.production

      # ── Envio via FTP ────────────────────────────────────────────────────
      # Envia o projeto já com vendor/ e public/build/ compilados.
      # O HostGator NÃO roda composer/npm, por isso o build acontece aqui.
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          log-level: verbose
          server-dir: clientify360/
          # Enviamos vendor/ e public/build/ (gerados no CI, ignorados no git).
          # Excluímos apenas o que não deve ir para o servidor compartilhado.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.*
            .editorconfig
            .gitattributes
            .gitignore
            phpunit.xml
            README.md
            **/.github/**
            storage/**
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/*.md
            **/.styleci.yml
